<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TALUS — Folder Upload</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root { --teal-dark:#0d6e6e;--teal-mid:#117a7a;--teal-accent:#14b8b8;--teal-light:#d0eaea;--teal-pale:#e8f4f4;--bg:#f0f7f7;--surface:#ffffff;--surface-2:#dceaea;--text-main:#1a2e2e;--text-muted:#5a7a7a;--border:#b0d0d0;--radius-sm:10px;--radius-md:16px;--header-h:62px; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;width:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text-main);}
    @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .shell{display:grid;grid-template-rows:var(--header-h) 1fr;grid-template-columns:1fr;grid-template-areas:"header""main";height:100vh;width:100vw;}
    header{grid-area:header;background:var(--teal-dark);display:flex;align-items:center;padding:0 28px;gap:16px;border-bottom:2px solid rgba(255,255,255,0.08);z-index:10;}
    .logo{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:#fff;letter-spacing:0.1em;}
    .header-subtitle{font-size:11px;color:rgba(255,255,255,0.45);letter-spacing:0.06em;text-transform:uppercase;margin-top:2px;}
    .header-divider{width:1px;height:28px;background:rgba(255,255,255,0.15);margin:0 8px;}
    .header-tabs{display:flex;gap:4px;margin-left:auto;}
    .tab-btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:rgba(255,255,255,0.55);background:transparent;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;transition:color 0.2s,background 0.2s;}
    .tab-btn:hover{color:#fff;background:rgba(255,255,255,0.08);}
    .tab-btn.active{background:rgba(255,255,255,0.15);color:#fff;}
    .profile-btn{position:relative;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.18);border:2px solid rgba(255,255,255,0.35);color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:16px;transition:background 0.15s;flex-shrink:0;}
    .profile-btn:hover{background:rgba(255,255,255,0.28);}
    .profile-dropdown{display:none;position:absolute;top:calc(100% + 10px);right:0;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);min-width:200px;box-shadow:0 8px 32px rgba(13,110,110,0.18);z-index:500;overflow:hidden;animation:slideUp 0.18s ease;}
    .profile-dropdown.open{display:block;}
    .profile-dropdown-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);}
    .profile-dropdown-name{font-size:14px;font-weight:700;color:var(--text-main);}
    .profile-dropdown-user{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-muted);margin-top:2px;}
    .profile-dropdown-item{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:14px;font-weight:500;color:var(--text-main);cursor:pointer;transition:background 0.13s;}
    .profile-dropdown-item:hover{background:var(--teal-pale);}
    .profile-dropdown-item.danger{color:#c0392b;}
    .profile-dropdown-item.danger:hover{background:#fdf0ee;}
    .profile-dropdown-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
    main{grid-area:main;overflow:hidden;display:flex;flex-direction:column;}
    .panel{display:none;flex-direction:column;flex:1;height:100%;overflow:hidden;}
    .panel.active{display:flex;}
    .send-layout{display:grid;grid-template-rows:auto 1fr;height:100%;padding:24px 28px;gap:20px;overflow:hidden;}
    .input-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
    .input-card{background:var(--teal-pale);border:1.5px solid var(--border);border-radius:var(--radius-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 12px 18px;cursor:pointer;position:relative;overflow:hidden;transition:background 0.18s,border-color 0.18s,transform 0.15s,box-shadow 0.18s;}
    .input-card:hover{background:var(--teal-light);border-color:var(--teal-accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(13,110,110,0.12);}
    .input-card.disabled{opacity:0.35;pointer-events:none;}
    .input-card svg{width:38px;height:38px;stroke:var(--teal-dark);fill:none;stroke-width:1.7;}
    .input-card span{font-size:14px;font-weight:600;color:var(--text-main);}
    .input-card input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;}
    .lower-area{display:flex;flex-direction:column;gap:12px;min-height:0;}
    .attached-bar{background:var(--teal-dark);color:#fff;font-weight:600;font-size:13px;letter-spacing:0.04em;padding:12px 16px;border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .count-badge{background:var(--teal-accent);color:#fff;font-family:'Space Mono',monospace;font-size:11px;padding:2px 9px;border-radius:20px;}
    .attached-scroll{overflow-y:auto;display:flex;flex-direction:column;gap:5px;max-height:200px;flex-shrink:0;}
    .attached-chip{display:flex;align-items:center;gap:8px;background:var(--teal-light);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-size:13px;font-weight:500;color:var(--teal-dark);}
    .chip-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .remove-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px;line-height:1;padding:0 2px;}
    .remove-btn:hover{color:#c0392b;}
    /* drag overlay */
    .dropzone-overlay{display:none;position:fixed;inset:0;background:rgba(13,110,110,0.15);border:4px dashed var(--teal-accent);z-index:400;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--teal-dark);pointer-events:none;}
    .dropzone-overlay.show{display:flex;}
    /* text modal */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,40,40,0.45);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--surface);border-radius:20px;padding:30px;width:500px;max-width:95vw;box-shadow:0 20px 60px rgba(13,110,110,0.22);border:1.5px solid var(--border);animation:slideUp 0.22s ease;}
    .modal-title{font-size:16px;font-weight:700;color:var(--teal-dark);margin-bottom:14px;}
    .modal textarea{width:100%;height:180px;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text-main);background:var(--teal-pale);resize:vertical;outline:none;transition:border-color 0.18s;}
    .modal textarea:focus{border-color:var(--teal-accent);}
    .modal-actions{display:flex;gap:10px;margin-top:14px;justify-content:flex-end;}
    .btn-cancel{padding:10px 22px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;color:var(--text-muted);transition:background 0.15s;}
    .btn-cancel:hover{background:var(--teal-pale);}
    .btn-primary{padding:10px 22px;border:none;border-radius:var(--radius-sm);background:var(--teal-dark);color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background 0.15s;}
    .btn-primary:hover{background:var(--teal-mid);}
    /* login */
    .login-screen{position:fixed;inset:0;z-index:1000;background:var(--teal-dark);display:flex;align-items:center;justify-content:center;}
    .login-screen.hidden{display:none;}
    .login-bg-pattern{position:absolute;inset:0;opacity:0.04;background-image:repeating-linear-gradient(45deg,#fff 0,#fff 1px,transparent 0,transparent 50%);background-size:20px 20px;pointer-events:none;}
    .login-box{position:relative;z-index:1;background:var(--surface);border-radius:24px;padding:44px 40px 36px;width:400px;max-width:94vw;box-shadow:0 24px 80px rgba(0,0,0,0.28);animation:slideUp 0.3s ease;}
    .login-logo{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;color:var(--teal-dark);letter-spacing:0.1em;text-align:center;margin-bottom:4px;}
    .login-tagline{text-align:center;font-size:12px;color:var(--text-muted);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:32px;}
    .login-field{margin-bottom:16px;}
    .login-field label{display:block;font-size:11px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
    .login-field input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text-main);background:var(--teal-pale);outline:none;transition:border-color 0.18s;}
    .login-field input:focus{border-color:var(--teal-accent);}
    .login-error{color:#c0392b;font-size:13px;margin-bottom:12px;min-height:18px;text-align:center;}
    .login-btn{width:100%;padding:13px;background:var(--teal-dark);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;transition:background 0.18s,transform 0.12s;}
    .login-btn:hover{background:var(--teal-mid);transform:translateY(-1px);}
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--teal-dark);color:#fff;padding:12px 26px;border-radius:40px;font-size:14px;font-weight:600;box-shadow:0 6px 30px rgba(13,110,110,0.30);opacity:0;pointer-events:none;transition:opacity 0.25s;z-index:300;white-space:nowrap;}
    .toast.show{opacity:1;}
  </style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-bg-pattern"></div>
  <div class="login-box">
    <div class="login-logo">TALUS</div>
    <div class="login-tagline">Secure File Transfer</div>
    <div class="login-field"><label>Username</label><input type="text" id="login-username" placeholder="Enter your username" autocomplete="username" onkeydown="if(event.key==='Enter') document.getElementById('login-password').focus()"/></div>
    <div class="login-field"><label>Password</label><input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()"/></div>
    <div class="login-error" id="login-error"></div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<div class="shell">
  <header>
    <div><div class="logo">TALUS</div><div class="header-subtitle">Secure File Transfer</div></div>
    <div class="header-divider"></div>
    <div class="header-tabs">
      <button class="tab-btn active">Send</button>
      <button class="tab-btn">Receive</button>
    </div>
    <div style="position:relative;margin-left:16px;">
      <button class="profile-btn" id="profile-btn" onclick="toggleProfileMenu()"></button>
      <div class="profile-dropdown" id="profile-dropdown">
        <div class="profile-dropdown-header">
          <div class="profile-dropdown-name" id="profile-display-name"></div>
          <div class="profile-dropdown-user" id="profile-display-user"></div>
        </div>
        <div class="profile-dropdown-item danger" onclick="doLogout()">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign Out
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="panel active" id="send-panel">
      <div class="send-layout">
        <div class="input-grid">
          <!-- TALUS-137: File upload card -->
          <label class="input-card" title="Attach one or more files">
            <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            <span>File</span>
            <input type="file" multiple onchange="attachFiles(event,'file')"/>
          </label>
          <!-- TALUS-110: Folder upload card -->
          <label class="input-card" title="Attach an entire folder">
            <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
            <span>Folder</span>
            <input type="file" webkitdirectory multiple onchange="attachFolder(event)"/>
          </label>
          <!-- TALUS-109 -->
          <div class="input-card" title="Compose text" onclick="openTextModal()">
            <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
            <span>Text</span>
          </div>
          <div class="input-card disabled" title="Clipboard — TALUS-138">
            <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
            <span>Paste</span>
          </div>
        </div>
        <div class="lower-area">
          <div class="attached-bar">
            <span id="attach-count-label">0 item(s) attached</span>
            <span class="count-badge" id="attach-count">0</span>
          </div>
          <div class="attached-scroll" id="attached-list"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Text modal (TALUS-109) -->
<div class="modal-overlay" id="text-modal">
  <div class="modal">
    <div class="modal-title">✏️ Compose Text Message</div>
    <textarea id="text-input" placeholder="Type your message here…"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeTextModal()">Cancel</button>
      <button class="btn-primary" onclick="attachText()">Attach Text</button>
    </div>
  </div>
</div>

<!-- Drag & drop overlay (TALUS-137) -->
<div class="dropzone-overlay" id="dropzone-overlay">⬇ Drop files to attach</div>
<div class="toast" id="toast"></div>

<script>
  let currentUser = null;
  let attachedItems = [];

  function doLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    if (!username || !password) { errEl.textContent = 'Please enter both fields.'; return; }
    if (password.length < 3) { errEl.textContent = 'Invalid username or password.'; return; }
    errEl.textContent = '';
    currentUser = { username, initials: username.slice(0,2).toUpperCase() };
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('profile-btn').textContent = currentUser.initials;
    document.getElementById('profile-display-name').textContent = username;
    document.getElementById('profile-display-user').textContent = '@' + username.toLowerCase().replace(/\s+/g,'');
  }
  function doLogout() {
    currentUser = null;
    document.getElementById('profile-dropdown').classList.remove('open');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-username').value = '';
    document.getElementById('login-password').value = '';
    document.getElementById('login-error').textContent = '';
    setTimeout(() => document.getElementById('login-username').focus(), 100);
  }
  function toggleProfileMenu() { document.getElementById('profile-dropdown').classList.toggle('open'); }
  document.addEventListener('click', function(e) {
    const btn = document.getElementById('profile-btn'), drop = document.getElementById('profile-dropdown');
    if (!btn.contains(e.target) && !drop.contains(e.target)) drop.classList.remove('open');
  });

  // TALUS-109: Text upload
  function openTextModal() { document.getElementById('text-modal').classList.add('open'); setTimeout(() => document.getElementById('text-input').focus(), 50); }
  function closeTextModal() { document.getElementById('text-modal').classList.remove('open'); }
  function attachText() {
    const val = document.getElementById('text-input').value.trim();
    if (!val) { toastMsg('Please enter some text first.'); return; }
    addItem(val.length > 32 ? val.slice(0,32)+'…' : val, 'text');
    document.getElementById('text-input').value = '';
    closeTextModal();
  }
  document.getElementById('text-modal').addEventListener('click', function(e) { if (e.target === this) closeTextModal(); });

  // TALUS-137: File upload
  function attachFiles(e, type) {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    files.forEach(f => addItem(f.name, 'file'));
    e.target.value = '';
  }

  // TALUS-110: Folder upload
  function attachFolder(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    const folderName = files[0].webkitRelativePath.split('/')[0];
    addItem(folderName, 'folder');
    e.target.value = '';
  }

  // TALUS-137: Drag & drop
  const overlay = document.getElementById('dropzone-overlay');
  let dragDepth = 0;
  document.addEventListener('dragenter', () => { dragDepth++; overlay.classList.add('show'); });
  document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; overlay.classList.remove('show'); } });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; overlay.classList.remove('show');
    Array.from(e.dataTransfer.files).forEach(f => addItem(f.name, 'file'));
  });

  function addItem(name, type) {
    const id = Date.now() + Math.random();
    attachedItems.push({ id, name, type });
    renderAttached();
    toastMsg(`"${name}" attached`);
  }
  function removeItem(id) { attachedItems = attachedItems.filter(i => i.id !== id); renderAttached(); }
  function renderAttached() {
    const count = attachedItems.length;
    document.getElementById('attach-count').textContent = count;
    document.getElementById('attach-count-label').textContent = `${count} item(s) attached`;
    document.getElementById('attached-list').innerHTML = attachedItems.map(item => `
      <div class="attached-chip">
        <span>${item.type==='folder'?'📁':item.type==='text'?'📝':'📄'}</span>
        <span class="chip-name">${item.name}</span>
        <button class="remove-btn" onclick="removeItem(${item.id})">×</button>
      </div>`).join('');
  }

  let toastTimer;
  function toastMsg(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }
</script>
</body>
</html>
